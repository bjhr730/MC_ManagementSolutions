name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Types and Astro template diagnostics.
      - run: npm run check

      # The owner-facing arithmetic and the lead form's validation. Owners
      # make real pricing decisions on these numbers.
      - run: npm run test

      # The contrast invariant. This used to live only in `npm run verify`,
      # which CI never called, so a colour change could reach main with
      # failing contrast and nothing would stop it.
      - run: npm run contrast

      - run: npm run build
        env:
          SITE_URL: https://example.com
